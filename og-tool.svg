<?xml version="1.0" encoding="UTF-8"?>
<!--
  Share card for the TOOL page. og-image.svg is the teardown's card, which
  adds a kicker and leads with the essay's hook instead. The coordinate space
  is 1200x627 (the Open Graph large-summary ratio) and og-tool.png is
  rendered from it at 2x, 2400x1254,
  because a 1x asset gets scaled up on high-DPI screens and softens.
  Edit here, not there - see the README for the render command.

  LAYOUT IS CENTERED ON PURPOSE. LinkedIn's profile "Featured" section does not
  honor the 1.91:1 ratio: it center-crops the image into a roughly square
  portrait frame, about 0.91:1, which throws away half the width. An earlier
  two-column version lost the word "Save" and half the photo card there.

  So every element lives inside a 540px-wide center column (x 330..870). That
  survives the Featured crop AND still reads as a deliberate centered card at
  full width. Do not push content out toward the edges - it will be cut.

  Colors are role values from tokens.css dark mode, copied literally because
  an SVG cannot read a stylesheet. The accent ramp is deliberately unused - it
  is reserved for measurement.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">

  <rect width="1200" height="627" fill="#10141a"/>

  <!-- ============ a photo whose date got corrected ============ -->

  <rect x="470" y="75" width="260" height="250" rx="14" fill="#1b2028" stroke="#3f4653" stroke-width="2"/>

  <rect x="490" y="95" width="220" height="130" rx="8" fill="#2b313b"/>
  <circle cx="668" cy="128" r="16" fill="#4c9bb0"/>
  <path d="M 490 225 L 556 158 L 604 203 L 636 175 L 710 225 Z" fill="#545c6b"/>
  <path d="M 490 225 L 538 181 L 586 225 Z" fill="#6f7887"/>

  <!-- Dates are left-aligned inside the card, not centered: centering them made
       the tick collide with the last digit of the corrected date. -->

  <!-- the wrong date Google left behind -->
  <text x="500" y="263"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" fill="#d96450">Aug 4, 2026</text>
  <line x1="496" y1="255" x2="646" y2="255" stroke="#d96450" stroke-width="3" stroke-linecap="round"/>

  <!-- the real capture date -->
  <text x="500" y="305"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" fill="#4aa576">Jun 12, 2019</text>
  <path d="M 670 292 L 680 302 L 700 280"
        fill="none" stroke="#4aa576" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ name and promise ============ -->

  <text x="600" y="420" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#f7f8f9">Save the Dates</text>

  <rect x="545" y="442" width="110" height="5" rx="2.5" fill="#4c9bb0"/>

  <text x="600" y="500" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#c8ced7">Fix wrong dates &amp; timezones</text>
  <text x="600" y="538" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#c8ced7">on your photos, right in your browser</text>

</svg>
